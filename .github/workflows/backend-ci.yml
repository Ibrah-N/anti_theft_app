# Backend CI: every pull request and every push to main runs the same checks
# as backend/scripts/check.sh, plus migration and secret-leak checks.
# Branch protection (GitHub settings) blocks merging unless this workflow is green.
name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older, now-useless run.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow can only read the repository.
permissions:
  contents: read

jobs:
  backend:
    name: Lint, types, migrations, tests
    runs-on: ubuntu-24.04          # same OS family as production
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Same values tests/conftest.py uses. They point at throwaway services
      # started below; none of these are real secrets.
      VIGILX_ENV_FILE: ""
      DATABASE_URL: postgresql+psycopg2://vigilx_test:vigilx_test@localhost:5433/vigilx_test
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "False"
      MQTT_HOST: localhost
      MQTT_PORT: "1884"
      MQTT_USERNAME: test
      MQTT_PASSWORD: test
      TURN_SECRET: ci-turn-secret
      TURN_HOST: turn.test.invalid

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"    # production runs 3.12
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy

      - name: Start test services (Postgres + Mosquitto)
        run: docker compose -f docker-compose.test.yml up -d --wait

      # Migrations must work on an empty database, and must be reversible.
      - name: Migrations - upgrade on empty DB
        run: alembic upgrade head

      - name: Migrations - downgrade to base
        run: alembic downgrade base

      - name: Migrations - upgrade again
        run: alembic upgrade head

      - name: Tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --no-color

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down --volumes --remove-orphans

  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # scan full history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}