# Tool configuration for the backend.
# Ruff = linter (finds bugs and bad patterns) + formatter (consistent layout).
#   ruff check .          # report problems
#   ruff check --fix .    # fix the safe ones automatically
#   ruff format .         # reformat every file

[tool.ruff]
target-version = "py312"          # production servers run Python 3.12
line-length = 100                 # the formatter wraps code to this width
extend-exclude = [
    "alembic/versions",           # migrations are history: never rewrite them
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: undefined names, unused imports/variables
    "I",   # import sorting
    "B",   # bugbear: likely bugs and design problems
    "UP",  # pyupgrade: modern Python syntax for the target version
]
# Never auto-fix these; they need a human:
#   E712: in SQLAlchemy, `Model.col == False` must become `Model.col.is_(False)`.
#         Ruff's fix (`is False`) turns the SQL filter into a plain Python False.
unfixable = ["E712"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120             # lines the formatter can't wrap (long strings, URLs)

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as default arguments.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]


# check_untyped_defs = true: check the inside of functions even when they have no type hints. Most of your code has none yet, so without this mypy would skip it.
# plugins = ["pydantic.mypy"] teaches mypy how Pydantic models work.
# firebase_admin has no type information at all, so we tell mypy not to complain about that one library.

[tool.mypy]
python_version = "3.12"
files = ["app"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true